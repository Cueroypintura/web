<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galería de Trabajos | Cuero y Pintura</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="Estilos.css" />
  <style>
    body {
      background-color: #f9f9f9;
    }

    .gallery-img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 15px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .gallery-img:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .lightbox {
      display: none;
      position: fixed;
      z-index: 1050;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
    }

    .lightbox .close {
      position: absolute;
      top: 30px;
      right: 40px;
      font-size: 2rem;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    h2 {
      font-weight: bold;
      color: #333;
    }

    .section-title {
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      color: #6c757d;
    }

    footer {
      background-color: #212529;
    }

    footer p {
      margin: 0;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark navbar-grande">
    <div class="container">
      <a class="navbar-brand" href="index.html">Cuero y Pintura</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
         <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
         <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
         <li class="nav-item"><a class="nav-link active" aria-current="page" href="galeria.html">Galería</a></li>
         <li class="nav-item"><a class="nav-link" href="contacto.php">Contacto</a></li>
         <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Galería -->
  <section class="container py-5">
    <h2 class="text-center section-title">Galería de Trabajos</h2>
    <div class="row g-4">
      <!-- 11 imágenes -->
      <div class="col-md-4"><img src="img/galeria1.jpeg" alt="Trabajo 1" class="gallery-img" onclick="openLightbox(this.src)" /></div>
      <div class="col-md-4"><img src="img/galeria2.png" alt="Trabajo 2" class="gallery-img" onclick="openLightbox(this.src)" /></div>
      <div class="col-md-4"><img src="img/galeria3.jpeg" alt="Trabajo 3" class="gallery-img" onclick="openLightbox(this.src)" /></div>
      <div class="col-md-4"><img src="img/galeria4.png" alt="Trabajo 4" class="gallery-img" onclick="openLightbox(this.src)" /></div>
      <div class="col-md-4"><img src="img/galeria5.png" alt="Trabajo 5" class="gallery-img" onclick="openLightbox(this.src)" /></div>
      <div class="col-md-4"><img src="img/galeria6.png" alt="Trabajo 6" class="gallery-img" onclick="openLightbox(this.src)" /></div>
      <div class="col-md-4"><img src="img/galeria7.png" alt="Trabajo 7" class="gallery-img" onclick="openLightbox(this.src)" /></div>
      <div class="col-md-4"><img src="img/galeria8.png" alt="Trabajo 8" class="gallery-img" onclick="openLightbox(this.src)" /></div>
      <div class="col-md-4"><img src="img/galeria9.png" alt="Trabajo 9" class="gallery-img" onclick="openLightbox(this.src)" /></div>
      <div class="col-md-6"><img src="img/galeria10.jpeg" alt="Trabajo 10" class="gallery-img" onclick="openLightbox(this.src)" /></div>
      <div class="col-md-6"><img src="img/galeria11.png" alt="Trabajo 11" class="gallery-img" onclick="openLightbox(this.src)" /></div>
    </div>
  </section>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <span class="close" onclick="closeLightbox()">&times;</span>
    <img src="" id="lightbox-img" />
  </div>

  <!-- Footer -->
  <footer class="text-white text-center py-4">
    <div class="container">
      <p>&copy; 2025 Cuero y Pintura. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script>
    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        closeLightbox();
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
