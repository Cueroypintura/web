  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .galeria-img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .galeria-img:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }

    .etiqueta {
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: #3b3b98;
      text-transform: uppercase;
    }

    /* Lightbox */
    #lightbox {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
      box-shadow: 0 0 30px rgba(255,255,255,0.3);
    }

    #cerrar {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 2.5rem;
      color: white;
      cursor: pointer;
      font-weight: bold;
      z-index: 10000;
    }

    #cerrar:hover {
      color: #ff4d4d;
    }
  </style>
</head>

<!-- Lightbox -->
<div id="lightbox" onclick="cerrarLightbox(event)">
  <span id="cerrar" onclick="cerrarLightbox(event)">✕</span>
  <img id="imagen-ampliada" src="" alt="Imagen Ampliada">
</div>

<script>
  function abrirLightbox(img) {
    const lightbox = document.getElementById("lightbox");
    const imagenAmpliada = document.getElementById("imagen-ampliada");
    imagenAmpliada.src = img.src;
    lightbox.style.display = "flex";
  }

  function cerrarLightbox(e) {
    if (e.target.id === "lightbox" || e.target.id === "cerrar") {
      document.getElementById("lightbox").style.display = "none";
    }
  }
</script>
